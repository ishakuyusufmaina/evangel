<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="180x180" href="asset/favicon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="asset/favicon-16x16.png">
  <link rel="manifest" href="asset/site.webmanifest">
  <link rel="mask-icon" href="asset/favicon-512x512.png" color="#ffffff">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="asset/mstile-150x150.png">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070d1a" media="(prefers-color-scheme: dark)">
  <title id="title">Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7fb;
      --glow-1: rgba(0, 102, 204, .22);
      --glow-2: rgba(0, 64, 128, .16);
      --card: rgba(255, 255, 255, .78);
      --card-border: rgba(15, 35, 70, .08);
      --text: #0b1b33;
      --muted: #5b6b85;
      --field: #fff;
      --field-border: #d3dbe8;
      --accent: #0a5cc2;
      --accent-2: #0b4a9e;
      --ring: rgba(10, 92, 194, .28);
      --danger: #c0262d;
      --danger-bg: rgba(192, 38, 45, .09);
      --shadow: 0 1px 2px rgba(11, 27, 51, .06), 0 24px 60px -12px rgba(11, 27, 51, .22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #070d1a;
        --glow-1: rgba(0, 110, 220, .30);
        --glow-2: rgba(0, 70, 150, .28);
        --card: rgba(16, 26, 46, .72);
        --card-border: rgba(255, 255, 255, .08);
        --text: #eef3fb;
        --muted: #93a3bd;
        --field: rgba(255, 255, 255, .04);
        --field-border: rgba(255, 255, 255, .12);
        --accent: #3b8bf0;
        --accent-2: #2a73d6;
        --ring: rgba(59, 139, 240, .35);
        --danger: #ff8086;
        --danger-bg: rgba(255, 90, 100, .12);
        --shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 30px 70px -15px rgba(0, 0, 0, .65);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--text);
      background:
        radial-gradient(60rem 40rem at 15% -10%, var(--glow-1), transparent 60%),
        radial-gradient(50rem 36rem at 100% 110%, var(--glow-2), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 44px 36px 36px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      backdrop-filter: blur(22px) saturate(140%);
      animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50px;
      border-top-left-radius: 0;
      border-top-right-radius:0;
      display: block;
      margin: 0 auto 22px;
      box-shadow: 0 0 0 4px var(--card), 0 0 0 5px var(--card-border), 0 12px 28px -8px rgba(0, 0, 0, .35);
    }

    .school {
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      min-height: 1em;
      margin-bottom: 8px;
    }
    h2 { font-size: 1.65rem; font-weight: 600; letter-spacing: -.01em; }
    .sub { margin: 6px 0 28px; font-size: .92rem; color: var(--muted); }

    form { text-align: left; }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      margin: 0 0 7px 2px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
    }
    .control { position: relative; }
    .control > svg.lead {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      stroke: var(--muted);
      pointer-events: none;
      transition: stroke .2s;
    }
    .control:focus-within > svg.lead { stroke: var(--accent); }

    input {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 44px;
      font: inherit;
      font-size: .98rem;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--field-border);
      border-radius: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: var(--muted); opacity: .7; }
    input:hover { border-color: var(--muted); }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }

    .toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      width: 38px;
      height: 38px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      background: none;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      cursor: pointer;
      transition: color .2s, background .2s;
    }
    .toggle:hover { color: var(--text); background: var(--field-border); }
    .toggle:focus-visible { outline: 2px solid var(--accent); }
    .toggle svg { width: 19px; height: 19px; }
    .toggle .off { display: none; }
    .toggle[aria-pressed="true"] .on { display: none; }
    .toggle[aria-pressed="true"] .off { display: block; }

    .error {
      display: none;
      margin: 2px 0 16px;
      padding: 11px 14px;
      font-size: .85rem;
      line-height: 1.4;
      color: var(--danger);
      background: var(--danger-bg);
      border-radius: 12px;
    }
    .error.show { display: block; animation: shake .4s; }
    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    #loginBtn {
      width: 100%;
      height: 52px;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px var(--accent);
      transition: transform .15s, box-shadow .2s, filter .2s;
    }
    #loginBtn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 14px 28px -8px var(--accent); }
    #loginBtn:active:not(:disabled) { transform: translateY(0); }
    #loginBtn:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
    #loginBtn:disabled { cursor: progress; filter: saturate(.7) brightness(.95); }
    #loginBtn.busy::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 20px;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .card { padding: 36px 22px 28px; border-radius: 20px; }
      h2 { font-size: 1.45rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img class="logo" src="logo.png" alt="School logo">
      <p class="school" id="h1"></p>
      <h2>Welcome back</h2>
      <p class="sub">Sign in to continue to your portal</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Username</label>
          <div class="control">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input type="text" id="email" placeholder="Enter your username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="control">
            <svg class="lead" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
        </div>

        <div class="error" id="error" role="alert" aria-live="assertive"></div>

        <button type="submit" id="loginBtn"><span id="loginLabel">Login</span></button>
      </form>
    </div>
  </main>

  <footer><small>©Mainafly 2026</small></footer>

  <script src="config.js"></script>
  <script src="batch2.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

    /* ---------- UI helpers ---------- */
    const logBtn = document.getElementById("loginBtn");
    const logLabel = document.getElementById("loginLabel");
    const errBox = document.getElementById("error");
    const emailInput = document.getElementById("email");
    const pwdInput = document.getElementById("password");

    function setBusy(text) {
      logBtn.disabled = !!text;
      logBtn.classList.toggle("busy", !!text);
      logLabel.textContent = text || "Login";
    }
    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.remove("show");
      void errBox.offsetWidth; // restart animation
      errBox.classList.add("show");
    }
    function clearError() { errBox.classList.remove("show"); }
    const friendly = (code) => ({
      "auth/invalid-credential": "Incorrect username or password.",
      "auth/wrong-password": "Incorrect username or password.",
      "auth/user-not-found": "Incorrect username or password.",
      "auth/invalid-email": "That username doesn't look right.",
      "auth/too-many-requests": "Too many attempts. Please wait a moment and try again.",
      "auth/network-request-failed": "Network error. Check your connection and try again."
    }[code] || "Login failed. Please try again.");

    emailInput.addEventListener("input", clearError);
    pwdInput.addEventListener("input", clearError);

    const toggle = document.getElementById("toggle");
    toggle.addEventListener("click", () => {
      const show = pwdInput.type === "password";
      pwdInput.type = show ? "text" : "password";
      toggle.setAttribute("aria-pressed", show);
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    /* ---------- App setup ---------- */
    document.getElementById("h1").textContent = schoolName;
    document.getElementById("title").textContent = schoolName + " - Login";
    setBusy("Please wait…");

    const app = initializeApp(firebaseConfig);
    getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let teachersRef = doc(db, schoolId, "teachers");
    let teacherDoc = await getDoc(teachersRef);
    let teachers = teacherDoc.exists() ? teacherDoc.data() : null;
    if (!teachers) {
      teachers = { [schoolId]: { name: schoolName, username: schoolId, psw: "123456" } };
      await setDoc(teachersRef, teachers);
    }
    setBusy();

    var schoolGeneratedUsername;

    async function onLoginSuccess(user, role) {
      if (!teachers[schoolGeneratedUsername]) {
        if (!(user.email == "dev@teacher." + schoolId)) {
          showError("Not on the staff list. Talk to your admin if you think this is a mistake.");
          setBusy();
          return;
        }
      }
      if (role == "admin") { window.location.href = "admin/admin.html"; return; }
      if (role == "teacher") { window.location.href = "teacher/index.html"; return; }
      if (role == "student") { window.location.href = "student/index.html"; return; }
      if (role == "guardian") { window.location.href = "guardian/index.html"; return; }
      if (role == "alumni") { window.location.href = "alumni/index.html"; return; }
      setBusy();
    }

    function goDirector(username) {
      if (username == "mcs001") { window.location.href = "admin/proprietress/index.html"; return true; }
      if (username == "mcs002") { window.location.href = "admin/director/index.html"; return true; }
      if (username == "mcs003") { window.location.href = "admin/director2/index.html"; return true; }
      return false;
    }

    const reg = /.*@/;

    async function signIn() {
      clearError();
      const username = emailInput.value.trim();
      const password = pwdInput.value;
      if (!username || !password) {
        showError("Please enter your username and password.");
        (username ? pwdInput : emailInput).focus();
        return;
      }
      setBusy("Signing in…");

      const email = username.replace(/@.*/, "") + `@teacher.${schoolId}`;
      schoolGeneratedUsername = username.replace(/@.*/, "");
      const role = username.replace(reg, "");

      if (role == "capital") {
        signInWithEmailAndPassword(auth, email, password)
          .then(async () => {
            const dDoc = await getDoc(doc(db, schoolId, "directors"));
            const dirs = dDoc.exists() ? dDoc.data() : {};
            if (!goDirector(dirs[schoolGeneratedUsername]?.username)) setBusy();
          })
          .catch(async (error) => {
            try {
              const dDoc = await getDoc(doc(db, schoolId, "directors"));
              const dirs = dDoc.exists() ? dDoc.data() : {};
              const user = dirs[schoolGeneratedUsername];
              if (user && user.psw == password) {
                await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(auth.currentUser, { displayName: user.name });
                if (goDirector(username)) return;
              }
              showError(friendly(error.code));
            } catch (e) {
              showError(friendly(e.code));
            }
            setBusy();
          });
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then((cred) => onLoginSuccess(cred.user, role))
        .catch(async (error) => {
          try {
            const user = teachers[schoolGeneratedUsername];
            if (user && user.psw == password) {
              await createUserWithEmailAndPassword(auth, email, password);
              const createdUser = auth.currentUser;
              await updateProfile(createdUser, { displayName: user.name });
              onLoginSuccess(createdUser, role);
              return;
            }
            showError(friendly(error.code));
          } catch (e) {
            showError(friendly(e.code));
          }
          setBusy();
        });
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      signIn();
    });
  </script>
</body>
</html>
